version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: telegram_bot_app
    restart: unless-stopped
    volumes:
      - .:/var/www/telegram_bot
    networks:
      - telegram_network
    env_file:
      - .env

  nginx:
    image: nginx:alpine
    container_name: telegram_bot_nginx
    restart: unless-stopped
    ports:
        - "80:80"
        - "443:443"
    volumes:
        - .:/var/www/telegram_bot
        - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
        - ./docker/nginx/ssl:/etc/letsencrypt/live/prushak.space-0001
    networks:
        - telegram_network

  postgres:
    image: postgres:15-alpine
    container_name: telegram_bot_postgres
    restart: unless-stopped
    ports:
        - "5433:5432"
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      TMPDIR: /var/www/telegram_bot/storage/tmp
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - telegram_network

  redis:
    image: redis:alpine
    container_name: telegram_bot_redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    networks:
      - telegram_network

networks:
  telegram_network:
    driver: bridge

volumes:
  pgdata:
